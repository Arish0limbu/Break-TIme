name: Daily Activity Automation

on:
  schedule:
    # Run daily at a random time between 9 AM and 11 PM UTC
    - cron: '0 9-23 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  daily-activity:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all history for commit counting
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
      
      - name: Create logs directory
        run: mkdir -p logs
      
      - name: Run daily activity automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd python
          python daily_activity.py
      
      - name: Upload activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-log
          path: logs/activity.log
          retention-days: 30